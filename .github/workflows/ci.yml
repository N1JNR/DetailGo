name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Formatacao
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Verifica formatacao
        run: npm run format:check

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Verifica tipos
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      - name: Executa lint
        run: npm run lint

  tests:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      # Roda com cobertura: mostra o número em toda PR e aplica o ratchet
      # (coverageThreshold) — o job falha se a cobertura regredir.
      - name: Executa testes com cobertura
        run: npm run test:cov -- --runInBand --watchAll=false

  # O build debug do Android nao empacota o JavaScript — o app busca o codigo do
  # Metro em tempo de execucao. So o release empacota, e por isso uma quebra no
  # empacotador passava por toda a esteira sem ninguem ver: foi assim que o
  # override do image-size derrubou o release sem o CI notar. Este job passa o
  # empacotador do jeito que o release passa e joga o resultado fora.
  bundle:
    name: Empacota o JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      # Sem keystore, sem google-services.json e sem Gradle: so o empacotador.
      # Responde "o app consegue ser empacotado?", nao "o app funciona?".
      - name: Gera o bundle de release
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/assets"

  functions-tests:
    name: Testes das Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      # Mesma versao do runtime das Cloud Functions (engines.node), para o
      # teste rodar onde o codigo vai rodar.
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instala dependencias das functions
        working-directory: functions
        run: npm ci

      - name: Executa testes das functions
        working-directory: functions
        run: npm test

  rules-tests:
    name: Testes das regras Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # O emulador do Firestore exige Java 21+ (firebase-tools 15+).
      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instala dependencias
        run: npm ci

      - name: Instala firebase-tools
        run: npm i -g firebase-tools@15.7.0

      - name: Executa testes das regras
        run: npm run test:rules

  # O build Android sozinho leva mais que toda a esteira somada. Ele so precisa
  # rodar quando alguma entrada dele muda.
  native-changes:
    name: Detecta mudancas nativas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filtro.outputs.android }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verifica se algo nativo mudou
        id: filtro
        shell: bash
        run: |
          # Fora de PR (push na main) compila sempre: e a execucao que popula
          # o cache do Gradle que as PRs leem.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          alterados="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")"

          if echo "$alterados" | grep -qE '^(android/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: native-changes
    # O assembleDebug nao empacota o JS — nenhuma tarefa de bundle roda nele.
    # Mudanca em src/ nao tem como quebrar este build; o que quebra e o
    # conteudo de android/, o conjunto de dependencias ou este workflow.
    if: needs.native-changes.outputs.android == 'true'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Substitui o "cache: gradle" do setup-java. Aquele so restaura
      # dependencias e, com a chave inalterada, nunca regrava o cache; este
      # guarda tambem o build cache de tarefas entre execucoes. So a main
      # escreve: PR nao envenena o cache que todo mundo usa.
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Instala dependencias
        run: npm ci

      - name: Instala CMake 3.31.6
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi
          "$SDKMANAGER" "cmake;3.31.6" || (set +o pipefail; yes 2>/dev/null | "$SDKMANAGER" "cmake;3.31.6")

      - name: Prepara google-services.json temporario
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "detailgo-ci",
              "storage_bucket": "detailgo-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.jnrpalma.detailgo"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Prepara debug keystore temporaria
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Uma ABI so. Este job responde "o app ainda compila?", e o C++ aqui vem
      # todo do codegen do React Native — nao ha codigo nosso que possa quebrar
      # em uma arquitetura e passar em outra. As quatro ABIs continuam no
      # android-apk.yml, que e quem gera APK para instalar.
      - name: Gera build Android debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache \
            -PreactNativeArchitectures=arm64-v8a

  secrets:
    name: Verifica arquivos sensiveis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Bloqueia arquivos sensiveis versionados
        shell: bash
        run: |
          blocked_regex='(^|/)(\.env(\..*)?|google-services\.json|GoogleService-Info\.plist|serviceAccountKey\.json|.*service-account.*\.json|.*credentials.*\.json|.*\.(jks|keystore|pem|p12|key|cer|der))$'
          found="$(git ls-files | grep -Ei "$blocked_regex" || true)"

          if [ -n "$found" ]; then
            echo "Arquivos sensiveis encontrados no Git:"
            echo "$found"
            exit 1
          fi

          if git grep -n -E '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----' -- . ':!package-lock.json'; then
            echo "Possivel chave privada encontrada no codigo."
            exit 1
          fi

  commit-lint:
    name: Valida mensagens de commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instala dependencias
        run: npm ci

      # Commits de bot (Renovate) sao auto-gerados como "chore(deps): ..." e nao
      # seguem o enum de tipos do projeto. A convecao vale so para commits humanos.
      - name: Valida commits do PR
        if: ${{ !contains(github.event.pull_request.user.login, 'renovate') }}
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
