// android/app/build.gradle (MODULE)
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Carrega chaves sensíveis do secrets.properties (não rastreado pelo git)
def secretsFile = rootProject.file("secrets.properties")
def secrets = new Properties()
if (secretsFile.exists()) {
    secrets.load(new FileInputStream(secretsFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // CMake 3.31.6 traz ninja 1.12, que não tem o limite fixo de 260 caracteres
    // do ninja 1.10 (padrão do RN). Sem isso o build nativo falha em caminhos
    // longos com "Filename longer than 260 characters".
    externalNativeBuild {
        cmake {
            version "3.31.6"
        }
    }

    namespace "com.testapp"
    defaultConfig {
        // applicationId = identidade do app na Play Store / Firebase (imutável
        // após publicar). O namespace interno segue "com.testapp" (código Kotlin).
        applicationId "com.jnrpalma.detailgo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.0"
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: secrets.getProperty("GOOGLE_MAPS_API_KEY", "")
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Chave de UPLOAD da Play Store, não a de assinatura final: com o Play
        // App Signing quem guarda a final é o Google. Perder a de upload é
        // recuperável; perder a final não seria.
        //
        // Lida do secrets.properties, que não é rastreado. Sem ele o bloco fica
        // nulo e o build de release falha dizendo o que falta — melhor falhar
        // do que publicar assinado com a chave de debug, que a Play Store
        // rejeita e que ainda quebraria o Maps por causa da SHA-1.
        release {
            def arquivo = secrets.getProperty("UPLOAD_STORE_FILE", "")
            if (arquivo) {
                storeFile file(arquivo)
                storePassword secrets.getProperty("UPLOAD_STORE_PASSWORD", "")
                keyAlias secrets.getProperty("UPLOAD_KEY_ALIAS", "")
                keyPassword secrets.getProperty("UPLOAD_KEY_PASSWORD", "")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

react {
    // autolinking padrão
    autolinkLibrariesWithApp()
}

dependencies {
    // dependências RN existentes
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // FIREBASE - BOM + LIBS
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-analytics'

    implementation "androidx.browser:browser:1.5.0"
    // ✅ PLAY INTEGRITY (OBRIGATÓRIO PARA PHONE AUTH)
    implementation 'com.google.android.play:integrity:1.4.0'

}

// Certifique-se de que o arquivo android/app/google-services.json exista
// e que o package_name nele bata com applicationId ("com.jnrpalma.detailgo").

apply plugin: 'com.google.gms.google-services'
// Crashlytics: o SDK nativo vem pelo autolinking do
// @react-native-firebase/crashlytics; aqui só aplicamos o plugin Gradle, que
// cuida do upload do mapping (R8) nos builds release.
apply plugin: 'com.google.firebase.crashlytics'
